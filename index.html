<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Nuestra trilogía?</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>¿Nuestra trilogía?</h1>
        <div class="movies-grid">
            <!-- Holiii, si vez esto, quería que supieras que te amo -->
            <div class="movie-card">
                <div class="movie-image-container">
                    <img src="source/before_sunrise.png" alt="Movie 1" class="movie-image">
                    <div class="movie-info">
                        <div class="title-container">
                            <h2 class="movie-title">Before Sunrise (1995)</h2>
                            <div class="watch-indicator not-watched" title="Not Watched">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                    <circle cx="12" cy="12" r="10"/>
                                </svg>
                            </div>
                        </div>
                        <div class="movie-details">
                            <p class="watch-date">Vista: ? Noviembre 9, 2025</p>
                            <p class="watch-place">Lugar: Online ヾ(＠⌒ー⌒＠)ノ</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Movie 2 -->
            <div class="movie-card">
                <div class="movie-image-container">
                    <img src="source/before_sunset_img1.png" alt="Movie 2" class="movie-image">
                    <div class="movie-info">
                        <div class="title-container">
                            <h2 class="movie-title">Before Sunset (2004)</h2>
                            <div class="watch-indicator watched" title="Watched">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                    <path d="M20 6L9 17l-5-5"/>
                                </svg>
                            </div>
                        </div>
                        <div class="movie-details">
                            <p class="watch-date">Vista: Octubre 16, 2025</p>
                            <p class="watch-place">Lugar: Medellin</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Movie 3 -->
            <div class="movie-card">
                <div class="movie-image-container">
                    <img src="source/before_midnight_img1.png" alt="Movie 3" class="movie-image">
                    <div class="movie-info">
                        <div class="title-container">
                            <h2 class="movie-title">Before Midnight (2013)</h2>
                            <div class="watch-indicator not-watched" title="Not Watched">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                    <circle cx="12" cy="12" r="10"/>
                                </svg>
                            </div>
                        </div>
                        <div class="movie-details">
                            <p class="watch-date">¿Cuándo?: La planearemos</p>
                            <p class="watch-place">¿Dónde?: Aún por asignar</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <p>All rights reserved, de Jose con amor para Natalia 💌</p>
    </footer>
</body>
</html>
