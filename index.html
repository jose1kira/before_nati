<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies to Watch</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Movies to Watch</h1>
        <div class="movies-grid">
            <!-- Movie 1 -->
            <div class="movie-card">
                <div class="movie-image-container">
                    <img src="https://via.placeholder.com/400x600/4A90E2/FFFFFF?text=Movie+1" alt="Movie 1" class="movie-image">
                    <div class="watch-indicator watched" title="Watched">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <path d="M20 6L9 17l-5-5"/>
                        </svg>
                    </div>
                </div>
                <div class="movie-info">
                    <h2 class="movie-title">The Great Adventure</h2>
                    <p class="movie-date">Release Date: March 15, 2024</p>
                    <div class="movie-details">
                        <p class="watch-date">Watched: April 20, 2024</p>
                        <p class="watch-place">Place: Home Theater</p>
                    </div>
                </div>
            </div>

            <!-- Movie 2 -->
            <div class="movie-card">
                <div class="movie-image-container">
                    <img src="https://via.placeholder.com/400x600/E94B3C/FFFFFF?text=Movie+2" alt="Movie 2" class="movie-image">
                    <div class="watch-indicator not-watched" title="Not Watched">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <circle cx="12" cy="12" r="10"/>
                        </svg>
                    </div>
                </div>
                <div class="movie-info">
                    <h2 class="movie-title">Mystery of Time</h2>
                    <p class="movie-date">Release Date: June 10, 2024</p>
                    <div class="movie-details">
                        <p class="watch-date">Not watched yet</p>
                        <p class="watch-place">Planned: Cinema</p>
                    </div>
                </div>
            </div>

            <!-- Movie 3 -->
            <div class="movie-card">
                <div class="movie-image-container">
                    <img src="https://via.placeholder.com/400x600/50C878/FFFFFF?text=Movie+3" alt="Movie 3" class="movie-image">
                    <div class="watch-indicator not-watched" title="Not Watched">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <circle cx="12" cy="12" r="10"/>
                        </svg>
                    </div>
                </div>
                <div class="movie-info">
                    <h2 class="movie-title">Future Dreams</h2>
                    <p class="movie-date">Release Date: August 5, 2024</p>
                    <div class="movie-details">
                        <p class="watch-date">Not watched yet</p>
                        <p class="watch-place">Planned: Streaming</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
